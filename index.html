<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luci - Tú inventas, yo te sigo</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Verdana, sans-serif;
    color: #fff7d6;
    background: linear-gradient(#0b1026, #1b2a4a);
    text-align: center;
  }
  .pantalla {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .oculta { display: none; }
  h1 { font-size: 3rem; margin: 10px; }
  p { font-size: 1.2rem; max-width: 340px; }
  .luci {
    width: 28px; height: 28px; border-radius: 50%;
    background: #ffe97a;
    box-shadow: 0 0 25px 10px rgba(255, 233, 122, 0.8);
    animation: volar 6s ease-in-out infinite;
    margin-bottom: 20px;
  }
  @keyframes volar {
    0% { transform: translate(0, 0); }
    25% { transform: translate(60px, -40px); }
    50% { transform: translate(-40px, -70px); }
    75% { transform: translate(-70px, 10px); }
    100% { transform: translate(0, 0); }
  }
  button, .boton {
    font-size: 1.3rem;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #ffe97a;
    color: #1b2a4a;
    font-weight: bold;
    cursor: pointer;
    margin: 8px;
  }
  .secundario {
    background: rgba(255, 255, 255, 0.15);
    color: #fff7d6;
    border: 2px solid #ffe97a;
  }
  .chip {
    font-size: 1.1rem;
    padding: 10px 18px;
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff7d6;
    border: 2px solid #ffe97a;
    margin: 5px;
  }
  #subir { display: none; }
  .sticker {
    max-width: 200px;
    max-height: 200px;
    border-radius: 20px;
    border: 5px solid #fff;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    animation: moverse 3s ease-in-out infinite;
    margin: 10px;
  }
  @keyframes moverse {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(2deg) translateY(-12px); }
  }
  .pagina { margin: 15px 0; }
  .pagina p { margin: 5px; }
  input[type=text] {
    font-size: 1.2rem;
    padding: 12px 18px;
    border-radius: 25px;
    border: none;
    text-align: center;
    width: 260px;
  }
</style>
</head>
<body>

<div id="inicio" class="pantalla">
  <div class="luci"></div>
  <h1>Luci</h1>
  <p>Tú inventas. Luci te sigue.</p>
  <button onclick="irACrear()">Crear un cuento</button>
</div>

<div id="crear" class="pantalla oculta">
  <h1 id="pregunta-dibujo">¿Qué dibujaste?</h1>
  <p>Si no sabes qué dibujar, prueba con:</p>
  <div>
    <span class="chip">un sol</span>
    <span class="chip">una casa</span>
    <span class="chip">un animalito</span>
  </div>
  <label class="boton" for="subir">Subir mi dibujo</label>
  <input id="subir" type="file" accept="image/*" onchange="mostrarDibujo(event)">
  <div id="escena"></div>
  <p id="pregunta-texto">¿Quién es? ¿Cómo se llama?</p>
  <input id="frase" type="text" placeholder="Escríbelo aquí">
  <br>
  <button id="boton-agregar" onclick="agregarPagina()">Así empieza mi cuento</button>
</div>

<div id="cuento" class="pantalla oculta">
  <h1>Mi cuento</h1>
  <div id="paginas"></div>
  <button onclick="leerCuento()">🔊 Luci, léelo</button>
  <button class="secundario" onclick="otraPagina()">¿Y luego qué pasó?</button>
  <button class="secundario" onclick="location.reload()">Crear otro cuento</button>
</div>

<script>
var paginas = [];
var dibujoActual = null;

function hablar(texto) {
  var voz = new SpeechSynthesisUtterance(texto);
  voz.lang = 'es-ES';
  voz.rate = 0.95;
  voz.pitch = 1.3;
  speechSynthesis.cancel();
  speechSynthesis.speak(voz);
}
function irACrear() {
  document.getElementById('inicio').classList.add('oculta');
  document.getElementById('crear').classList.remove('oculta');
  hablar('¡Hola! Yo soy Luci. ¿Qué dibujaste hoy?');
}
function mostrarDibujo(evento) {
  var archivo = evento.target.files[0];
  if (!archivo) return;
  var lector = new FileReader();
  lector.onload = function(e) {
    dibujoActual = e.target.result;
    var img = document.createElement('img');
    img.src = dibujoActual;
    img.className = 'sticker';
    document.getElementById('escena').innerHTML = '';
    document.getElementById('escena').appendChild(img);
    hablar('¡Qué dibujo tan bonito!');
  };
  lector.readAsDataURL(archivo);
}
function agregarPagina() {
  var frase = document.getElementById('frase').value;
  if (paginas.length === 0) {
    frase = 'Había una vez, ' + (frase || 'un amigo misterioso') + '.';
  } else if (!frase) {
    frase = 'Y la aventura siguió.';
  }
  paginas.push({ img: dibujoActual, texto: frase });
  dibujoActual = null;
  mostrarCuento();
}
function mostrarCuento() {
  var zona = document.getElementById('paginas');
  zona.innerHTML = '';
  for (var i = 0; i < paginas.length; i++) {
    var div = document.createElement('div');
    div.className = 'pagina';
    if (paginas[i].img) {
      var img = document.createElement('img');
      img.src = paginas[i].img;
      img.className = 'sticker';
      div.appendChild(img);
    }
    var p = document.createElement('p');
    p.textContent = paginas[i].texto;
    div.appendChild(p);
    zona.appendChild(div);
  }
  document.getElementById('crear').classList.add('oculta');
  document.getElementById('cuento').classList.remove('oculta');
  window.scrollTo(0, 0);
}
function otraPagina() {
  document.getElementById('pregunta-dibujo').textContent = '¿Y luego qué pasó?';
  document.getElementById('pregunta-texto').textContent = 'Cuéntalo en una frase';
  document.getElementById('boton-agregar').textContent = 'Agregar página';
  document.getElementById('frase').value = '';
  document.getElementById('escena').innerHTML = '';
  document.getElementById('cuento').classList.add('oculta');
  document.getElementById('crear').classList.remove('oculta');
  hablar('¿Y luego qué pasó? Dibuja lo que sigue.');
}
function leerCuento() {
  var todo = '';
  for (var i = 0; i < paginas.length; i++) {
    todo = todo + paginas[i].texto + ' ';
  }
  todo = todo + 'Y colorín colorado, este cuento se ha acabado.';
  hablar(todo);
}
</script>

</body>
</html>
