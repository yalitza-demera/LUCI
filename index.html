<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luci - Tú inventas, yo te sigo</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Verdana, sans-serif;
    color: #fff7d6;
    background: linear-gradient(#0b1026, #1b2a4a);
    text-align: center;
  }
  .pantalla {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .oculta { display: none; }
  h1 { font-size: 3rem; margin: 10px; }
  p { font-size: 1.2rem; max-width: 340px; }
  .luci {
    width: 28px; height: 28px; border-radius: 50%;
    background: #ffe97a;
    box-shadow: 0 0 25px 10px rgba(255, 233, 122, 0.8);
    animation: volar 6s ease-in-out infinite;
    margin-bottom: 20px;
  }
  @keyframes volar {
    0% { transform: translate(0, 0); }
    25% { transform: translate(60px, -40px); }
    50% { transform: translate(-40px, -70px); }
    75% { transform: translate(-70px, 10px); }
    100% { transform: translate(0, 0); }
  }
  button, .boton {
    font-size: 1.3rem;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #ffe97a;
    color: #1b2a4a;
    font-weight: bold;
    cursor: pointer;
    margin: 8px;
  }
  .chip {
    font-size: 1.1rem;
    padding: 10px 18px;
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff7d6;
    border: 2px solid #ffe97a;
    margin: 5px;
  }
  #subir { display: none; }
  .sticker {
    max-width: 220px;
    max-height: 220px;
    border-radius: 20px;
    border: 5px solid #fff;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    animation: moverse 3s ease-in-out infinite;
    margin: 15px;
  }
  @keyframes moverse {
    0%, 100% { transform: rotate(-2deg) translateY(0); }
    50% { transform: rotate(2deg) translateY(-12px); }
  }
  input[type=text] {
    font-size: 1.2rem;
    padding: 12px 18px;
    border-radius: 25px;
    border: none;
    text-align: center;
    width: 260px;
  }
</style>
</head>
<body>

<div id="inicio" class="pantalla">
  <div class="luci"></div>
  <h1>Luci</h1>
  <p>Tú inventas. Luci te sigue.</p>
  <button onclick="irACrear()">Crear un cuento</button>
</div>

<div id="crear" class="pantalla oculta">
  <h1>¿Qué dibujaste?</h1>
  <p>Si no sabes qué dibujar, prueba con:</p>
  <div>
    <span class="chip">un sol</span>
    <span class="chip">una casa</span>
    <span class="chip">un animalito</span>
  </div>
  <label class="boton" for="subir">Subir mi dibujo</label>
  <input id="subir" type="file" accept="image/*" onchange="mostrarDibujo(event)">
  <div id="escena"></div>
  <div id="nombre-zona" class="oculta">
    <p>¿Quién es? ¿Cómo se llama?</p>
    <input id="nombre" type="text" placeholder="Escribe su nombre">
    <br>
    <button onclick="empezarCuento()">Así empieza mi cuento</button>
  </div>
</div>

<div id="cuento" class="pantalla oculta">
  <p>Había una vez...</p>
  <div id="escena-cuento"></div>
  <h1 id="titulo-cuento"></h1>
  <p>Y este es solo el principio ✨</p>
  <button onclick="location.reload()">Crear otro</button>
</div>
<script>
function irACrear() {
  document.getElementById('inicio').classList.add('oculta');
  document.getElementById('crear').classList.remove('oculta');
}
function mostrarDibujo(evento) {
  var archivo = evento.target.files[0];
  if (!archivo) return;
  var lector = new FileReader();
  lector.onload = function(e) {
    var img = document.createElement('img');
    img.src = e.target.result;
    img.className = 'sticker';
    document.getElementById('escena').innerHTML = '';
    document.getElementById('escena').appendChild(img);
    document.getElementById('nombre-zona').classList.remove('oculta');
  };
  lector.readAsDataURL(archivo);
}
function empezarCuento() {
  var nombre = document.getElementById('nombre').value || 'un amigo misterioso';
  var sticker = document.querySelector('#escena img');
  document.getElementById('escena-cuento').innerHTML = '';
  document.getElementById('escena-cuento').appendChild(sticker);
  document.getElementById('titulo-cuento').textContent = nombre;
  document.getElementById('crear').classList.add('oculta');
  document.getElementById('cuento').classList.remove('oculta');
}
</script>

</body>
</html>
