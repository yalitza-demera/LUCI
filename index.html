<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luci - Tú inventas, yo te sigo</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Verdana, sans-serif;
    color: #fff7d6;
    background: linear-gradient(#0b1026, #1b2a4a);
    text-align: center;
    overflow: hidden;
  }
  h1 { font-size: 3.5rem; margin: 0; }
  p { font-size: 1.2rem; max-width: 320px; }
  .luci {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ffe97a;
    box-shadow: 0 0 25px 10px rgba(255, 233, 122, 0.8);
    animation: volar 6s ease-in-out infinite;
    margin-bottom: 20px;
  }
  @keyframes volar {
    0% { transform: translate(0, 0); }
    25% { transform: translate(60px, -40px); }
    50% { transform: translate(-40px, -70px); }
    75% { transform: translate(-70px, 10px); }
    100% { transform: translate(0, 0); }
  }
  button {
    font-size: 1.3rem;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #ffe97a;
    color: #1b2a4a;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="luci"></div>
  <h1>Luci</h1>
  <p>Tú inventas. Luci te sigue. Cuentos que tú dibujas y narras.</p>
  <button onclick="document.getElementById('mensaje').style.display='block'">Crear un cuento</button>
  <p id="mensaje" style="display:none">Muy pronto... estamos construyendo ✨</p>
</body>
</html>
